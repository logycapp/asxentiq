<div class="sidebar-brand sidebar-logo relative">
    <img
      class="sidebar-brand-logo sidebar-text"
      id="sidebar-brand-logo"
      [src]="sidebarBrandLogo"
      alt="Asxentiq"
    />
    <div class="sidebar-brand-copy sidebar-text">
      <p class="sidebar-kicker"><span class="sidebar-kicker__dot"></span> PLATAFORMA DE GESTIÓN</p>
    </div>
    <button
      class="sidebar-toggle-button absolute -right-3 top-2 z-10"
      id="sidebar-toggle"
      type="button"
      (click)="toggleSidebar.emit()"
    >
      <span class="material-symbols-outlined text-[18px]" id="toggle-icon">{{ isSidebarCollapsed ? 'dock_to_right' : 'dock_to_left' }}</span>
    </button>
  </div>

  <div class="sidebar-search-wrap sidebar-text">
    <label class="sidebar-search-shell">
      <span class="material-symbols-outlined sidebar-search-icon" aria-hidden="true">search</span>
      <input
        class="sidebar-search-input"
        aria-label="Buscar en el menú"
        placeholder="Buscar en el menú"
        type="text"
      />
    </label>
  </div>

  <div class="sidebar-nav-heading sidebar-text">MENÚ PRINCIPAL</div>
  <nav class="sidebar-nav flex-1 overflow-y-auto" id="sidebar-nav" aria-label="Navegación principal">
    <ng-container *ngFor="let item of menuItems; trackBy: trackByRoute">
      <!-- Item with children (submenu) -->
      <div *ngIf="item.children && item.children.length > 0" class="has-submenu" [attr.data-submenu-id]="submenuId(item)">
        <button
          #submenuBtn
          class="sidebar-item sidebar-item--parent group"
          [class.sidebar-item-active]="isSubmenuOpen(submenuId(item))"
          [attr.title]="isSidebarCollapsed ? item.label : null"
          type="button"
          (click)="onToggleSubmenu(submenuId(item), submenuBtn)"
        >
          <span class="sidebar-item__main">
            <span class="sidebar-item__icon"><span class="material-symbols-outlined">{{ mapIcon(item.icon) }}</span></span>
            <span class="sidebar-item__label sidebar-text">{{ item.label }}</span>
          </span>
          <span class="material-symbols-outlined sidebar-item__chevron expand-icon" [class.rotated]="isSubmenuOpen(submenuId(item))">expand_more</span>
        </button>
        <div
          class="submenu submenu-outer"
          [id]="submenuId(item)"
          [class.open]="isSubmenuOpen(submenuId(item))"
        >
          <div class="submenu-panel">
            <a
              *ngFor="let child of item.children; trackBy: trackByChildRoute"
              class="submenu-link"
              [routerLink]="child.route"
              routerLinkActive="submenu-link-active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <span class="submenu-dot shrink-0"></span>
              {{ child.label }}
            </a>
          </div>
        </div>
      </div>

      <!-- Item without children -->
      <a
        *ngIf="!item.children || item.children.length === 0"
        class="sidebar-item sidebar-item--link group"
        [routerLink]="item.route"
        routerLinkActive="sidebar-item-active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        [attr.title]="isSidebarCollapsed ? item.label : null"
      >
        <span class="sidebar-item__icon"><span class="material-symbols-outlined">{{ mapIcon(item.icon) }}</span></span>
        <span class="sidebar-item__label sidebar-text">{{ item.label }}</span>
      </a>
    </ng-container>
  </nav>
