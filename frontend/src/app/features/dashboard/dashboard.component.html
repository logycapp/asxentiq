<app-page-header
  title="Plataforma Asxentiq"
  subtitle="Selecciona un módulo para consultar sus herramientas y procesos."
  [showDateFilter]="false"
>
  <nav header-breadcrumbs aria-label="breadcrumb" class="page-header-breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a routerLink="/dashboard" class="d-inline-flex align-items-center gap-1">
          <span class="material-symbols-outlined text-[15px]">home</span>
          Inicio
        </a>
      </li>
      <li class="breadcrumb-item active d-inline-flex align-items-center gap-1" aria-current="page">
        <span class="material-symbols-outlined text-[15px]">dashboard</span>
        Dashboard
      </li>
    </ol>
  </nav>
</app-page-header>

<section class="row g-4 row-cols-1 row-cols-md-2 row-cols-xl-3 dashboard-module-grid" aria-label="Módulos de Asxentiq">
  <div class="col" *ngFor="let module of modules">
    <article class="dashboard-module-card h-100" [ngClass]="'dashboard-module-card--' + module.tone">
      <div class="dashboard-module-card__wash" aria-hidden="true"></div>
      <a
        *ngIf="module.route"
        class="dashboard-module-card__link"
        [routerLink]="module.route"
        [attr.aria-label]="'Abrir módulo ' + module.name"
      ></a>
      <div class="dashboard-module-card__content">
        <div class="dashboard-module-card__top">
          <div class="dashboard-module-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <ng-container [ngSwitch]="module.icon">
                <ng-container *ngSwitchCase="'people'">
                  <circle cx="9" cy="8" r="3.2"></circle>
                  <path d="M3.5 19v-1.2a5.5 5.5 0 0 1 11 0V19"></path>
                  <path d="M16 5.2a3.2 3.2 0 0 1 0 6.2M17.2 14a4.7 4.7 0 0 1 3.3 4.5V19"></path>
                </ng-container>
                <ng-container *ngSwitchCase="'shield'">
                  <path d="M12 3 19 6v5.3c0 4.5-2.9 7.8-7 9.7-4.1-1.9-7-5.2-7-9.7V6l7-3Z"></path>
                  <path d="m8.8 12.1 2.1 2.1 4.4-4.5"></path>
                </ng-container>
                <ng-container *ngSwitchCase="'analytics'">
                  <path d="M4 19V5M4 19h16"></path>
                  <path d="M8 16v-4M12 16V8M16 16v-7M20 16v-3"></path>
                </ng-container>
              </ng-container>
            </svg>
          </div>
          <span class="dashboard-module-card__badge">Módulo</span>
        </div>

        <h2 class="dashboard-module-card__title">{{ module.name }}</h2>
        <p class="dashboard-module-card__description">{{ module.description }}</p>

        <ul class="dashboard-module-card__highlights" aria-label="Funciones principales">
          <li *ngFor="let highlight of module.highlights">{{ highlight }}</li>
        </ul>
      </div>
      <div class="dashboard-module-card__bottom" aria-hidden="true">
        <span>Plataforma Asxentiq</span>
        <span class="dashboard-module-card__footer-mark"></span>
      </div>
    </article>
  </div>
</section>
