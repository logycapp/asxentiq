<app-page-header
  title="Capacitaciones"
  subtitle="Resumen de los 8 indicadores principales del módulo."
  [showDateFilter]="false"
>
  <nav header-breadcrumbs aria-label="breadcrumb" class="page-header-breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a routerLink="/dashboard" class="d-inline-flex align-items-center gap-1">
          <span class="material-symbols-outlined text-[15px]">home</span>
          Inicio
        </a>
      </li>
      <li class="breadcrumb-item active d-inline-flex align-items-center gap-1" aria-current="page">
        <span class="material-symbols-outlined text-[15px]">dashboard</span>
        Dashboard
      </li>
    </ol>
  </nav>
</app-page-header>

<div class="mb-5">
  <div *ngIf="loading" class="text-on-surface-variant font-body-md py-4">Cargando indicadores de capacitaciones...</div>
  <div *ngIf="errorMessage" class="alert alert-warning">{{ errorMessage }}</div>
  <div *ngIf="!loading && !errorMessage" class="row g-4 row-cols-1 row-cols-md-2 row-cols-xl-4 dashboard-kpi-grid">
    <div *ngFor="let metric of trainingMetrics" class="glass-card p-4 rounded-4 h-100 group dashboard-kpi-card dashboard-kpi-card--vivid">
      <div class="dashboard-kpi-glow" [ngClass]="metric.accent"></div>
      <div class="flex justify-between items-start mb-sm position-relative z-1">
        <span
          class="material-symbols-outlined dashboard-kpi-icon"
          [ngStyle]="{ color: metric.iconColor, '-webkit-text-fill-color': metric.iconColor }"
        >{{ metric.icon }}</span>
        <span class="badge rounded-pill dashboard-kpi-badge">{{ metric.helper }}</span>
      </div>
      <p class="dashboard-kpi-label text-on-surface-variant font-label-sm uppercase tracking-[0.18em] text-[10px] font-bold position-relative z-1">{{ metric.label }}</p>
      <p class="dashboard-kpi-value font-headline-md text-on-surface mt-1 position-relative z-1">{{ metric.value }}</p>
      <p class="dashboard-kpi-note font-body-sm text-on-surface-variant mt-2 mb-0 position-relative z-1">{{ metric.note }}</p>
    </div>
  </div>
</div>
